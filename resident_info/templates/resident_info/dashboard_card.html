<div class="h-100 module-card" draggable="true" data-module="resident_info"
     style="background: linear-gradient(135deg, {{ module_card_color_start|default('#0d6efd') }} 0%, {{ module_card_color_end|default('#0a58ca') }} 100%); color: white; border: none; cursor: grab;">
    <div class="d-flex flex-column justify-content-center align-items-center text-center p-3 h-100">
        <div class="fs-5 fw-bold mb-2">
            <i class="bi bi-person-vcard me-2"></i>居民信息
        </div>
        <div class="fs-1 fw-bold">{{ total|default(0) }}</div>
        <div class="small opacity-75">本周新增 {{ recent|default(0) }} 条</div>
    </div>
</div>
